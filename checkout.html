<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pages & Co. | Bag</title>

    <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="checkout-page">
    <header class="site-header" id="siteHeader"></header>

    <main>
        <section class="page-hero" aria-labelledby="bag-title">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="./index.html">Home</a>
                    <span>/</span>
                    <span>Bag</span>
                </nav>

                <h1 id="bag-title">Your bag</h1>
            </div>
        </section>

        <section class="bag-section" aria-labelledby="bag-content-title">
            <div class="container bag-layout">
                <section class="bag-items" aria-labelledby="bag-content-title">
                    <h2 id="bag-content-title">Shopping bag</h2>

                    <div id="cartItems">
                        <!-- Cart items rendered by JavaScript -->
                    </div>
                </section>

                <aside class="order-summary" aria-labelledby="summary-title">
                    <h2 id="summary-title">Order summary</h2>

                    <dl>
                        <div>
                            <dt>Subtotal</dt>
                            <dd id="subtotal">$0.00</dd>
                        </div>

                        <div>
                            <dt>Shipping</dt>
                            <dd>Free</dd>
                        </div>

                        <div class="summary-total">
                            <dt>Total</dt>
                            <dd id="total">$0.00</dd>
                        </div>
                    </dl>

                    <button type="button" class="btn btn-primary checkout-btn" id="checkoutBtn">
                        Checkout
                    </button>
                    <p class="checkout-note">You'll be asked to sign in to complete your order.</p>
                </aside>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <aside class="login-modal" id="loginModal" aria-hidden="true"></aside>

    <script src="./js/data/books.js"></script>
    <script src="./js/data/genres.js"></script>
    <script src="./js/data/users.js"></script>
    <script src="./js/components/site-header.js"></script>
    <script src="./js/components/site-footer.js"></script>
    <script src="./js/components/login-modal.js"></script>
    <script src="./js/core/utils.js"></script>
    <script src="./js/core/cart-store.js"></script>
    <script src="./js/pages/checkout-page.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
