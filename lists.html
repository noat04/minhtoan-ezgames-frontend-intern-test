<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pages & Co. | Books</title>

    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <header class="site-header">
        <div class="container header-wrapper">
            <a href="./index.html" class="logo">Pages & Co.</a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="./index.html">Home</a>
                <a href="./list.html">Books</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>

            <div class="header-actions">
                <button type="button" class="signin-btn" data-open-login>Sign in</button>
                <a href="./checkout.html" class="bag-link">
                    Bag <span class="bag-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="page-hero" aria-labelledby="books-title">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="./index.html">Home</a>
                    <span>/</span>
                    <span>Books</span>
                </nav>

                <h1 id="books-title">All books</h1>
                <p>14 titles in the collection</p>
            </div>
        </section>

        <section class="book-list-section" aria-labelledby="collection-title">
            <div class="container">
                <div class="list-toolbar">
                    <div>
                        <h2 id="collection-title">Book collection</h2>
                        <p>Filter and sort books by your reading preference.</p>
                    </div>

                    <form class="sort-form">
                        <label for="sortSelect">Sort by</label>
                        <select id="sortSelect">
                            <option value="featured">Featured</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Top Rated</option>
                        </select>
                    </form>
                </div>

                <nav class="filter-bar" id="filterBar" aria-label="Book genre filters">
                    <!-- Filter buttons rendered by JavaScript -->
                </nav>

                <div class="book-grid" id="bookList">
                    <!-- Book cards rendered by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-wrapper">
            <section>
                <h2 class="footer-title">Pages & Co.</h2>
                <p>Curated books for curious readers.</p>
            </section>

            <nav class="footer-nav" aria-label="Footer navigation">
                <a href="./index.html">Home</a>
                <a href="./list.html">Books</a>
                <a href="./checkout.html">Bag</a>
            </nav>
        </div>
    </footer>

    <aside class="login-modal" id="loginModal" aria-hidden="true">
        <div class="modal-overlay" data-close-login></div>

        <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="login-title">
            <button type="button" class="modal-close" data-close-login aria-label="Close login modal">
                ×
            </button>

            <h2 id="login-title">Sign in</h2>

            <form id="loginForm" class="login-form">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required />

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required />

                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </section>
    </aside>

    <script src="./js/data/books.js"></script>
    <script src="./js/data/genres.js"></script>
    <script src="./js/data/users.js"></script>
    <script src="./js/components/login-modal.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
