<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pages & Co. | Books</title>

    <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="list-page">
    <header class="site-header" id="siteHeader"></header>

    <main>
        <section class="page-hero" aria-labelledby="books-title">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="./index.html">Home</a>
                    <span>/</span>
                    <span>Books</span>
                </nav>

                <h1 id="books-title">All books</h1>
                <p>14 titles in the collection</p>
            </div>
        </section>

        <section class="book-list-section" aria-labelledby="collection-title">
            <div class="container">
                <div class="list-toolbar">
                    <div>
                        <h2 id="collection-title">Book collection</h2>
                        <p>Filter and sort books by your reading preference.</p>
                    </div>

                    <nav class="filter-bar" id="filterBar" aria-label="Book genre filters">
                        <!-- Filter buttons rendered by JavaScript -->
                    </nav>

                    <form class="sort-form">
                        <label for="sortSelect">Sort by</label>
                        <select id="sortSelect">
                            <option value="featured">Featured</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Top Rated</option>
                        </select>
                    </form>
                </div>

                <div class="book-grid" id="bookList">
                    <!-- Book cards rendered by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <aside class="login-modal" id="loginModal" aria-hidden="true"></aside>

    <script src="./js/data/books.js"></script>
    <script src="./js/data/genres.js"></script>
    <script src="./js/data/users.js"></script>
    <script src="./js/components/site-header.js"></script>
    <script src="./js/components/site-footer.js"></script>
    <script src="./js/components/login-modal.js"></script>
    <script src="./js/core/utils.js"></script>
    <script src="./js/core/cart-store.js"></script>
    <script src="./js/components/book-card.js"></script>
    <script src="./js/pages/list-page.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
